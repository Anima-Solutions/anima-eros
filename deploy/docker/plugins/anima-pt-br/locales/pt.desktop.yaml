"messaging.platformDescription.a2a": "Não precisa de pacotes extras (só a biblioteca padrão)."
"messaging.platformDescription.api_server": "Exponha o Eros como uma API HTTP compatível com a OpenAI para ferramentas como o Open WebUI."
"messaging.platformDescription.bluebubbles": "Use o Eros pelo iMessage com um servidor BlueBubbles."
"messaging.platformDescription.buzz": "Requer o binário da CLI buzz (https://github.com/block/buzz) no PATH ou em BUZZ_CLI_PATH."
"messaging.platformDescription.dingtalk": "Conecte o Eros a grupos do DingTalk (钉钉)."
"messaging.platformDescription.discord": "Conecte o Eros a conversas diretas, canais e threads do Discord."
"messaging.platformDescription.email": "Converse com o Eros por uma caixa de e-mail IMAP/SMTP."
"messaging.platformDescription.feishu": "Use o Eros dentro do Feishu / Lark."
"messaging.platformDescription.google_chat": "Conecte o Eros ao Google Chat pelo Cloud Pub/Sub."
"messaging.platformDescription.irc": "Repasse mensagens entre um canal de IRC (ou mensagens diretas) e o Eros."
"messaging.platformDescription.line": "Use o Eros no LINE pelo webhook da LINE Messaging API."
"messaging.platformDescription.matrix": "Use o Eros em salas e mensagens diretas do Matrix."
"messaging.platformDescription.mattermost": "Conecte o Eros a canais e mensagens diretas do Mattermost."
"messaging.platformDescription.msgraph_webhook": "Receba notificações de mudança do Microsoft Graph (reuniões do Teams, Outlook…)."
"messaging.platformDescription.ntfy": "Converse com o Eros por tópicos push do ntfy (ntfy.sh ou auto-hospedado)."
"messaging.platformDescription.photon": "Use o Eros pelo iMessage com a plataforma gerenciada Spectrum, da Photon."
"messaging.platformDescription.qqbot": "Conecte o Eros a um QQ Bot da QQ Open Platform."
"messaging.platformDescription.raft": "Entre em um workspace do Raft como agente externo."
"messaging.platformDescription.relay": "Adaptador de repasse genérico, atendido pelo conector Hermes Relay."
"messaging.platformDescription.signal": "Conecte por uma ponte REST do signal-cli."
"messaging.platformDescription.simplex": "Converse com o Eros pelo SimpleX Chat, com um daemon simplex-chat local."
"messaging.platformDescription.slack": "Use o Eros no Slack pelo Socket Mode. Adicione os IDs de membros do Slack permitidos para que os bots conectados possam responder."
"messaging.platformDescription.sms": "Envie e receba mensagens de texto pela Twilio."
"messaging.platformDescription.teams": "Conecte o Eros a chats do Microsoft Teams pelo Bot Framework."
"messaging.platformDescription.telegram": "Use o Eros em conversas diretas, grupos e tópicos do Telegram."
"messaging.platformDescription.webhook": "Receba eventos do GitHub, do GitLab e de outras fontes de webhook."
"messaging.platformDescription.wecom": "Bot de grupo do WeCom só de envio, por webhook."
"messaging.platformDescription.wecom_callback": "Integração do WeCom nos dois sentidos, por app de callback."
"messaging.platformDescription.weixin": "Conecte uma conta pessoal do WeChat pela iLink Bot API da Tencent."
"messaging.platformDescription.whatsapp": "Use o Eros pela ponte do WhatsApp que acompanha o app, com autenticação por QR code."
"messaging.platformDescription.whatsapp_cloud": "Use o Eros pela WhatsApp Cloud API hospedada pela Meta (sem ponte local)."
"messaging.platformDisabled": "{0} desativado"
"messaging.platformEnabled": "{0} ativado"
"messaging.platformIntro.api_server": "Exponha o Eros como uma API compatível com a OpenAI. Defina uma chave de autenticação e aponte o Open WebUI / LobeChat / etc. para host:porta."
"messaging.platformIntro.bluebubbles": "Rode o BlueBubbles Server em um Mac com iMessage, exponha a API dele e aponte o Eros para a URL com a senha do servidor."
"messaging.platformIntro.dingtalk": "Crie um app do DingTalk no console de desenvolvedor e copie aqui o Client ID (App key) e o Client Secret."
"messaging.platformIntro.discord": "Abra o Discord Developer Portal, crie um aplicativo, adicione um Bot e copie o token dele. Convide o bot para o seu servidor com os escopos certos."
"messaging.platformIntro.email": "Use uma caixa de e-mail dedicada. No Gmail/Workspace, crie uma senha de app e use imap.gmail.com / smtp.gmail.com."
"messaging.platformIntro.feishu": "Crie um app do Feishu / Lark, configure o recurso de bot e copie o App ID, o App secret e as chaves de criptografia de eventos."
"messaging.platformIntro.homeassistant": "No Home Assistant, abra seu perfil e crie um token de acesso de longa duração. Cole-o aqui junto com a URL do HA."
"messaging.platformIntro.matrix": "Entre no seu homeserver com a conta do bot e copie o token de acesso, o ID de usuário e a URL do homeserver."
"messaging.platformIntro.mattermost": "No seu servidor Mattermost, crie uma conta de bot ou um token de acesso pessoal e cole aqui a URL do servidor e o token."
"messaging.platformIntro.qqbot": "Registre um app na QQ Open Platform (q.qq.com) e copie o App ID e o Client Secret."
"messaging.platformIntro.signal": "Rode uma ponte REST do signal-cli em um endereço acessível e aponte o Eros para a URL e o número de telefone registrado."
"messaging.platformIntro.slack": "Crie um app do Slack, ative o Socket Mode, instale-o no seu workspace e copie o token do bot e o token de nível do app."
"messaging.platformIntro.sms": "Pegue o Account SID e o Auth Token no console da Twilio, além de um número de telefone que envie SMS."
"messaging.platformIntro.telegram": "No Telegram, fale com o @BotFather, rode /newbot e copie o token que ele fornecer. Depois pegue seu ID numérico de usuário com o @userinfobot."
"messaging.platformIntro.webhook": "Rode um servidor HTTP para o qual outras ferramentas (GitHub, GitLab, apps próprios) possam fazer POST. Use o secret para verificar as assinaturas."
"messaging.platformIntro.wecom": "Adicione um robô de grupo no WeCom e copie a chave do webhook como WECOM_BOT_ID. Só envia; use a opção WeCom (app) para conversa nos dois sentidos."
"messaging.platformIntro.wecom_callback": "Configure um app próprio no WeCom, exponha a URL de callback e informe o corp ID, o secret, o agent ID e a chave AES."
"messaging.platformIntro.weixin": "Rode `hermes gateway setup`, escolha Weixin e escaneie e confirme o QR code com uma conta pessoal do WeChat. O Eros se conecta pela iLink Bot API da Tencent e salva as credenciais."
"messaging.platformIntro.whatsapp": "Inicie a ponte do WhatsApp que vem com o Eros, escaneie o QR code na primeira execução e ative o canal."
