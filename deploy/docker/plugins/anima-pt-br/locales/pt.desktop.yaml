"intro.stock.none.0": "Faça uma pergunta, cole um erro ou me aponte um repositório. Eu leio código, uso ferramentas e ajudo você a entregar."
"intro.stock.none.1": "Descreva a tarefa com suas palavras. Eu escolho as ferramentas certas, explico meu plano e confirmo antes de passos arriscados."
"intro.stock.none.2": "Mande um caminho de arquivo, um traceback ou uma ideia solta. Eu investigo, sugiro os próximos passos e mantenho tudo reversível."
"intro.stock.none.3": "Pesquise no repositório, edite arquivos, rode testes, abra PRs. Diga o objetivo e eu cuido da parte mecânica."
"intro.stock.none.4": "Digite uma tarefa, pergunta ou trecho de código. Eu lembro da sessão, cito minhas fontes e pergunto quando estiver em dúvida."
