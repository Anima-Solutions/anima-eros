"settings.fieldDescriptions.agent.imageInputMode": "Controla como os anexos de imagem são enviados ao modelo."
"settings.fieldDescriptions.agent.maxTurns": "Limite de etapas com chamadas de ferramenta antes de o Eros interromper uma execução."
"settings.fieldDescriptions.approvals.mode": "Como o Eros trata comandos que precisam de aprovação explícita."
"settings.fieldDescriptions.approvals.timeout": "Quanto tempo os pedidos de aprovação esperam antes de expirar."
"settings.fieldDescriptions.auxiliary.compression.timeout": "Segundos de espera pelo modelo auxiliar de compactação em cada chamada (padrão 120). Aumente para modelos locais lentos."
"settings.fieldDescriptions.browser.useRealProfile": "A navegação local usa seus logins reais. O Eros copia o perfil do seu navegador padrão (cookies, logins, preferências) para uma cópia gerenciada e a controla com o Chromium embutido; seu perfil em uso nunca é aberto diretamente, e a cópia é atualizada a partir dele a cada execução. Também permite ao agente abrir uma sessão local com o perfil real quando pedido, mesmo com um navegador na nuvem configurado. Só navegadores Chromium (Chrome, Edge, Brave, Brave Origin, Chromium) são suportados; um navegador padrão que não seja Chromium falha com uma mensagem clara. Desativado por padrão."
"settings.fieldDescriptions.checkpoints.enabled": "Cria pontos de restauração antes de editar arquivos."
"settings.fieldDescriptions.codeExecution.mode": "O quanto a execução de código fica restrita ao projeto atual."
"settings.fieldDescriptions.compression.codexGpt55Autoraise": "Eleva a compactação para 85% nos modelos ChatGPT Codex OAuth suportados."
"settings.fieldDescriptions.compression.enabled": "Resume o contexto mais antigo quando as conversas ficam grandes."
"settings.fieldDescriptions.context.engine": "Estratégia para conversas longas perto do limite de contexto."
"settings.fieldDescriptions.desktop.repoScanEnabled": "Procura repositórios Git em pastas locais para mostrar em Projetos."
"settings.fieldDescriptions.desktop.repoScanExcludePaths": "Pastas (e suas subpastas) a ignorar na descoberta de repositórios."
"settings.fieldDescriptions.desktop.repoScanRoots": "Pastas a verificar. Deixe vazio para verificar sua pasta pessoal."
"settings.fieldDescriptions.display.personality": "Estilo padrão do assistente em novas sessões."
"settings.fieldDescriptions.display.showReasoning": "Mostra as seções de raciocínio quando o backend as fornece."
"settings.fieldDescriptions.fallbackProviders": "Entradas provedor:modelo de reserva para tentar se o modelo padrão falhar."
"settings.fieldDescriptions.fileReadMaxChars": "Máximo de caracteres que o Eros pode ler em uma leitura de arquivo."
"settings.fieldDescriptions.memory.memoryEnabled": "Salva memórias duradouras que podem ajudar em sessões futuras."
"settings.fieldDescriptions.memory.userProfileEnabled": "Mantém um perfil compacto das preferências do usuário."
"settings.fieldDescriptions.model": "Usado em novas conversas, a menos que você escolha outro modelo no campo de mensagem."
"settings.fieldDescriptions.modelContextLength": "Substitui a janela de contexto detectada apenas do modelo PRINCIPAL da conversa (em tokens). Deixe em 0 para usar o valor detectado do modelo selecionado. Não afeta modelos auxiliares nem de mistura de agentes."
"settings.fieldDescriptions.security.redactSecrets": "Oculta segredos detectados do conteúdo visível ao modelo, quando possível."
"settings.fieldDescriptions.stt.echoTranscripts": "Publica de volta na conversa a transcrição 🎙️ bruta das mensagens de voz."
"settings.fieldDescriptions.stt.elevenlabs.languageCode": "Código de idioma ISO-639-3 opcional. Em branco, a ElevenLabs detecta sozinha."
"settings.fieldDescriptions.stt.enabled": "Ativa a transcrição de fala local ou por um provedor."
"settings.fieldDescriptions.stt.streaming": "Mostra o texto enquanto você fala (OpenAI, xAI, ElevenLabs). Em caso de falha, volta para a gravação."
"settings.fieldDescriptions.terminal.cwd": "Pasta de projeto padrão para o trabalho com ferramentas e terminal."
"settings.fieldDescriptions.terminal.daytonaImage": "Imagem usada quando o backend de execução é o Daytona."
"settings.fieldDescriptions.terminal.dockerImage": "Imagem de contêiner usada quando o backend de execução é o Docker."
"settings.fieldDescriptions.terminal.envPassthrough": "Variáveis de ambiente repassadas para a execução das ferramentas."
"settings.fieldDescriptions.terminal.modalImage": "Imagem usada quando o backend de execução é o Modal."
"settings.fieldDescriptions.terminal.persistentShell": "Backend SSH: mantém as variáveis exportadas entre comandos. Desativado, cada comando começa do ambiente de login; o diretório de trabalho sempre se mantém."
"settings.fieldDescriptions.terminal.singularityImage": "Imagem usada quando o backend de execução é o Singularity."
"settings.fieldDescriptions.timezone": "Identificador de fuso horário IANA. Em branco, usa o fuso do sistema."
"settings.fieldDescriptions.tts.neutts.device": "Dispositivo de inferência local do NeuTTS."
"settings.fieldDescriptions.tts.xai.autoSpeechTags": "Deixa um LLM inserir marcações expressivas de áudio ([laughing], [sighs]) no roteiro antes da síntese."
"settings.fieldDescriptions.tts.xai.bitRate": "Taxa de bits do MP3 em bps. Só vale quando o codec é mp3."
"settings.fieldDescriptions.tts.xai.language": "Código do idioma falado (ex.: en, pt-BR) ou \"auto\" para detectar automaticamente."
"settings.fieldDescriptions.tts.xai.optimizeStreamingLatency": "Equilíbrio entre latência e qualidade. 0 = melhor qualidade, 2 = menor latência."
"settings.fieldDescriptions.tts.xai.sampleRate": "Taxa de amostragem do áudio em Hz. Maior = melhor qualidade, arquivos maiores."
"settings.fieldDescriptions.tts.xai.speed": "Velocidade de reprodução. 0,7 = mais lenta, 1,0 = normal, 1,5 = mais rápida."
"settings.fieldDescriptions.tts.xai.voiceId": "ID de voz da xAI (ex.: eve) ou um ID de voz personalizado."
"settings.fieldDescriptions.updates.nonInteractiveLocalChanges": "Quando o Eros se atualiza pelo app (sem pergunta no terminal), mantém as edições locais no código (stash) ou as descarta (discard). Atualizações pelo terminal sempre perguntam."
"settings.fieldDescriptions.voice.autoTts": "Fala automaticamente as respostas do assistente."
"settings.fieldDescriptions.voice.gptLive.instructions": "Frases extras para a persona da voz ao vivo (tom, ritmo, idioma). O Eros mantém o próprio prompt de sistema."
"settings.fieldDescriptions.voice.gptLive.voice": "Voz do modo GPT-Live. IDs de voz personalizados são aceitos."
"settings.fieldDescriptions.voice.voiceChatMode": "chained: fala em texto → Eros → texto em fala com os provedores abaixo. gpt-live: um único modelo de voz full-duplex da OpenAI (gpt-live-1) ouve e fala, e passa todo pedido de verdade ao Eros; o modelo que você selecionou responde com todas as ferramentas. Requer uma chave de API da OpenAI; a camada de voz custa US$ 0,05 por minuto."
