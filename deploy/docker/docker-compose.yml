# =============================================================================
# Produção — Ânima Eros (gateway, dashboard, Webapp e API da Hermes num container)
# Variáveis lidas do arquivo .env (veja .env.example). Comandos: `make help`.
# =============================================================================
name: ${APP_NAME:-anima-eros}

services:
  eros:
    # Gerada pelo `make build`: a imagem base (Dockerfile da raiz) e, por cima, a camada do Eros
    # (deploy/docker/Dockerfile, VNC/XFCE). Não há `build:` aqui: o build em duas etapas é do Makefile.
    image: ${APP_NAME:-anima-eros}:${IMAGE_TAG:-latest}
    container_name: ${APP_NAME:-anima-eros}
    restart: unless-stopped
    command: ["gateway", "run"]
    # Ferramentas de navegador (Chromium) precisam de mais que os 64 MB padrão.
    shm_size: 1g
    # Sem portas publicadas: o Nginx Proxy Manager chega pelo nome do container
    # (http://<APP_NAME>:9119 dashboard, :9120 Webapp, :8642 API) na rede `proxy`.
    expose:
      - "9119"
      - "9120"
      - "8642"
    volumes:
      # Dados da Hermes (o ~/.hermes do container): /srv/appdata/<app>/hermes
      - ${APPDATA_DIR:-/srv/appdata/anima-eros}/hermes:/opt/data
      # Pacote de idioma pt-BR (versionado neste repositório, só leitura). Ativado pelo `make configure`.
      - ./plugins/anima-pt-br:/opt/data/plugins/anima-pt-br:ro
    environment:
      # Dono dos arquivos de dados no host (o container remapeia o usuário hermes para este UID/GID)
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # Instalação própria, não o Hermes Cloud. Sem isto, a pasta /opt/data da imagem faz o dashboard
      # se achar no Hermes Cloud e mostrar o aviso de que vai ser desativado.
      HERMES_HOSTING: self_hosted
      # Dashboard, supervisionado pelo próprio container
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_PUBLIC_URL: ${DASHBOARD_URL:?defina DASHBOARD_URL no .env}
      # Login pela conta Nous (OAuth), além do usuário e senha. Vazio = só usuário e senha
      HERMES_DASHBOARD_OAUTH_CLIENT_ID: ${DASHBOARD_OAUTH_CLIENT_ID:-}
      # Login por usuário e senha (o bind fora do loopback exige um provedor de login)
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USERNAME:?defina DASHBOARD_USERNAME no .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:?defina DASHBOARD_PASSWORD no .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SESSION_SECRET:?defina DASHBOARD_SESSION_SECRET no .env}
      # API compatível com OpenAI: liga quando API_SERVER_KEY tem valor
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      TZ: ${TZ:-America/Sao_Paulo}
    networks:
      - default
      # Rede compartilhada com o Nginx Proxy Manager. No proxy, aponte SEMPRE para o nome do
      # container (APP_NAME), nunca para o nome do serviço: o Docker dá a cada container o nome
      # do serviço como apelido, e dois stacks com o mesmo serviço dividiriam o tráfego.
      - proxy
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-8G}
          cpus: "${CPU_LIMIT:-2.0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: ${PROXY_NETWORK:-anima_proxymanager_shared_network}
    external: true
